[pytest]
testpaths = tests

addopts =
    -ra
    --strict-markers
    --browser chromium
    --tracing retain-on-failure
    --video retain-on-failure
    --screenshot only-on-failure
    --alluredir=reports/allure-results

markers =
    smoke: Critical business-flow tests
    regression: Full functional regression suite
    ui: Browser-based UI tests
    api: REST API tests
    integration: Cross-layer validation
    bdd: Behaviour-driven scenarios
    accessibility: Accessibility checks
    serial: Tests that must not run concurrently