name: Nightly Cross-Browser Regression

on:
  schedule:
    - cron: "0 1 * * *"

  workflow_dispatch:

jobs:
  regression:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies and browsers
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m playwright install --with-deps

      - name: Initialise demonstration database
        run: python database/initialise_database.py

      - name: Execute cross-browser regression
        env:
          UI_BASE_URL: ${{ secrets.UI_BASE_URL }}
          API_BASE_URL: ${{ secrets.API_BASE_URL }}
          STANDARD_USER: ${{ secrets.STANDARD_USER }}
          STANDARD_PASSWORD: ${{ secrets.STANDARD_PASSWORD }}
          API_USERNAME: ${{ secrets.API_USERNAME }}
          API_PASSWORD: ${{ secrets.API_PASSWORD }}
        run: |
          python -m pytest \
            -m "regression or accessibility or integration or bdd" \
            --browser chromium \
            --browser firefox \
            --browser webkit \
            -n 2 \
            -v

      - name: Upload complete test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-regression-results
          path: |
            reports
            test-results
          if-no-files-found: warn